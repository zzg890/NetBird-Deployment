name: Deploy NetBird

# Required secrets:  SSH_PRIVATE_KEY, NETBIRD_SETUP_KEY, CLOUDFLARE_API_TOKEN
#                    (token needs Zone:DNS:Edit and Zone:Zone:Read)
# Required variables: DOMAIN (e.g. netbird.example.com)
# Optional variables: SSH_USER (default root), NETBIRD_UPSTREAM_PORT (default 8080),
#                     NETBIRD_MANAGEMENT_URL (default NetBird cloud)

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: Ubuntu server address
        default: 43.133.38.112
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ inputs.server_ip }}
      SSH_USER: ${{ vars.SSH_USER || 'root' }}
      DOMAIN: ${{ vars.DOMAIN }}
      UPSTREAM_PORT: ${{ vars.NETBIRD_UPSTREAM_PORT || '8080' }}
      MANAGEMENT_URL: ${{ vars.NETBIRD_MANAGEMENT_URL }}
      SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate inputs
        run: |
          [ -n "$DOMAIN" ] || { echo "Variable DOMAIN is required"; exit 1; }
          [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid DOMAIN"; exit 1; }
          [[ "$UPSTREAM_PORT" =~ ^[0-9]+$ ]] || { echo "Invalid port"; exit 1; }
          [[ "$SERVER_IP" =~ ^[0-9.]+$ ]] || { echo "Invalid server IP"; exit 1; }

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Install and configure NetBird
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SERVER_IP" \
            "SETUP_KEY='$SETUP_KEY' MANAGEMENT_URL='$MANAGEMENT_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          if ! command -v netbird >/dev/null; then
            curl -fsSL https://pkgs.netbird.io/install.sh | $SUDO sh
          fi
          ARGS=(up --setup-key "$SETUP_KEY")
          [ -z "$MANAGEMENT_URL" ] || ARGS+=(--management-url "$MANAGEMENT_URL")
          $SUDO netbird service install 2>/dev/null || true
          $SUDO netbird service start 2>/dev/null || true
          $SUDO netbird "${ARGS[@]}"
          $SUDO netbird status
          REMOTE

      - name: Create nginx domain reverse proxy config
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SERVER_IP" \
            "DOMAIN='$DOMAIN' PORT='$UPSTREAM_PORT' bash -s" <<'REMOTE'
          set -euo pipefail
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO tee "/etc/nginx/conf.d/$DOMAIN.conf" >/dev/null <<CONF
          server {
              listen 80;
              server_name $DOMAIN;

              location / {
                  proxy_pass http://127.0.0.1:$PORT;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          CONF
          $SUDO nginx -t
          $SUDO systemctl reload nginx
          REMOTE

      - name: Enable Cloudflare proxy (orange cloud)
        run: |
          api() { curl -fsS -H "Authorization: ******" -H "Content-Type: application/json" "$@"; }
          ZONE_NAME="$(echo "$DOMAIN" | awk -F. '{print $(NF-1)"."$NF}')"
          ZONE_ID="$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | jq -r '.result[0].id')"
          [ -n "$ZONE_ID" ] && [ "$ZONE_ID" != null ] || { echo "Zone not found"; exit 1; }
          BODY="$(jq -n --arg n "$DOMAIN" --arg c "$SERVER_IP" '{type:"A",name:$n,content:$c,proxied:true,ttl:1}')"
          REC_ID="$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=$DOMAIN" | jq -r '.result[0].id // empty')"
          if [ -n "$REC_ID" ]; then
            api -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$REC_ID" -d "$BODY" | jq '.success'
          else
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" -d "$BODY" | jq '.success'
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
